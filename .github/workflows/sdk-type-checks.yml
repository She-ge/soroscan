name: SDK Type Checks

on:
  push:
    branches: [main, develop]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-type-checks.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-type-checks.yml"

jobs:
  typescript-typecheck:
    name: TypeScript strict type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict type check
        run: npx tsc --noEmit

  python-typecheck:
    name: Python mypy strict type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: mypy strict type check
        run: python -m mypy soroscan/ --strict
